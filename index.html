<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A6B66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kasirku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: katalog produk di kiri, struk hidup di kanan. Di layar sempit struk jadi lembar dari bawah. */
:root{
  --bg:#E8EEF1; --surface:#F6F9FA; --raised:#FFFFFF; --ink:#13232B; --muted:#586C77; --line:#CAD6DC;
  --accent:#0A6B66; --accent-ink:#FFFFFF; --accent-soft:#D3ECE9;
  --danger:#B3261E; --danger-soft:#F7DCD9;
  --paper:#FFFFFF; --paper-ink:#1B2A31; --paper-line:#B9C6CD;
  --tile-l:90%; --tile-ink-l:28%;
  --scrim:rgba(10,20,25,.5);
  --shadow:0 1px 2px rgba(19,35,43,.08),0 8px 24px rgba(19,35,43,.08);
  --font-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E181D; --surface:#15232A; --raised:#1B2D35; --ink:#E4EDF1; --muted:#8FA4AF; --line:#2B3F49;
    --accent:#43C6B8; --accent-ink:#04231F; --accent-soft:#16403C;
    --danger:#F2877F; --danger-soft:#3E1E1B;
    --paper:#1F313A; --paper-ink:#E4EDF1; --paper-line:#3B515C;
    --tile-l:22%; --tile-ink-l:78%;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181D; --surface:#15232A; --raised:#1B2D35; --ink:#E4EDF1; --muted:#8FA4AF; --line:#2B3F49;
  --accent:#43C6B8; --accent-ink:#04231F; --accent-soft:#16403C;
  --danger:#F2877F; --danger-soft:#3E1E1B;
  --paper:#1F313A; --paper-ink:#E4EDF1; --paper-line:#3B515C;
  --tile-l:22%; --tile-ink-l:78%;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;flex-wrap:wrap;gap:10px 16px;padding-block:12px}
.brand{flex:1 1 200px;min-width:0}
.brand h1{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{font:400 12px var(--font-mono);color:var(--muted)}
.tag{font:500 12px var(--font-mono);color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:4px 10px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.tab{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:8px 14px;border-radius:9px;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.main{padding-block:16px 120px}

/* Buttons and fields */
.btn{border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:10px 12px;min-height:44px}
.field::placeholder{color:var(--muted)}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}

/* Kasir layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.toolbar{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;min-height:36px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--accent-soft);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.note p{flex:1 1 220px;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;min-width:0;text-align:left;border:1px solid var(--line);background:var(--raised);border-radius:14px;padding:0;overflow:hidden}
.tile:active{transform:scale(.98)}
.pic{aspect-ratio:1/1;max-width:100%;width:100%;display:grid;place-items:center;overflow:hidden;background:hsl(var(--h,200) 38% var(--tile-l));color:hsl(var(--h,200) 45% var(--tile-ink-l));font-weight:700;font-size:38px;letter-spacing:-.02em}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.meta{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px}
.nm{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pr{font:500 14px var(--font-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.badge{position:absolute;top:8px;right:8px;min-width:28px;height:28px;padding:0 8px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:600 13px var(--font-mono);display:grid;place-items:center;box-shadow:var(--shadow)}
.empty{grid-column:1/-1;border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty .btn{margin-top:14px}

/* Struk */
.cart-panel{position:sticky;top:88px;align-self:start}
.paper{position:relative;display:flex;flex-direction:column;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:8px 8px 0 0;box-shadow:var(--shadow);margin-bottom:8px;max-height:calc(100vh - 104px)}
.paper::after{content:"";position:absolute;left:-1px;right:-1px;bottom:-7px;height:6px;background:conic-gradient(from -45deg at bottom,transparent,var(--paper) 1deg 90deg,transparent 91deg) 0 0/12px 100%}
.paper-head{padding:16px 18px 12px;text-align:center;border-bottom:1px dashed var(--paper-line);position:relative}
.paper-head .shop{font:600 14px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.paper-head .sub{font:400 12px var(--font-mono);color:var(--muted);margin-top:2px}
.sheet-close{display:none;position:absolute;left:12px;top:12px;border:0;background:transparent;color:var(--muted);font-weight:600;padding:6px}
.clear{position:absolute;right:12px;top:12px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:6px}
.lines{flex:1 1 auto;min-height:60px;overflow:auto;padding:4px 18px}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:10px 0;border-bottom:1px dotted var(--paper-line)}
.line:last-child{border-bottom:0}
.line .t{font-weight:600;overflow-wrap:anywhere}
.line .amt{font:500 14px var(--font-mono);text-align:right;font-variant-numeric:tabular-nums}
.line .unit{font:400 12px var(--font-mono);color:var(--muted);align-self:center}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--paper-line);background:transparent;color:inherit;font:600 17px var(--font-mono);line-height:1;padding:0}
.stepper b{min-width:22px;text-align:center;font:600 14px var(--font-mono)}
.line .rm{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 0 6px 8px;justify-self:end}
.cart-empty{padding:26px 0;text-align:center;font:400 13px var(--font-mono);color:var(--muted)}
.pay{padding:12px 18px 18px;display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--paper-line)}
.total-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.total-row .lbl{font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.total-row .amt{font:600 30px/1 var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{border:1px solid var(--paper-line);background:transparent;border-radius:9px;padding:9px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.cash{display:flex;align-items:center;gap:8px;border:1px solid var(--paper-line);border-radius:10px;padding:0 12px}
.cash span{font:500 15px var(--font-mono);color:var(--muted)}
.cash input{flex:1;min-width:0;border:0;background:transparent;font:500 20px var(--font-mono);padding:10px 0;outline:none;font-variant-numeric:tabular-nums}
.cash:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.quick button{border:1px solid var(--paper-line);background:transparent;border-radius:8px;padding:6px 10px;font:500 13px var(--font-mono);min-height:34px}
.change-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:var(--font-mono)}
.change-row .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.change-row .val{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.change-row .val.short{color:var(--danger)}
#payBtn{min-height:52px;font-size:16px}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cartbar .info{flex:1;min-width:0}
.cartbar .info small{display:block;color:var(--muted);font-size:12px}
.cartbar .info b{font:600 18px var(--font-mono);font-variant-numeric:tabular-nums}
.backdrop{position:fixed;inset:0;z-index:39;background:var(--scrim)}

/* Produk */
.section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;margin-bottom:14px}
.section-head h2{font-size:20px;font-weight:700}
.panel{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:20px;max-width:560px}
.plist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:8px 10px 8px 8px}
.prow .th{width:56px;height:56px;border-radius:8px;overflow:hidden}
.prow .th .pic{font-size:20px}
.prow .info{min-width:0}
.prow .nm{min-height:0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{font:400 13px var(--font-mono);color:var(--muted);overflow-wrap:anywhere}

/* Riwayat */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;max-width:760px}
.stat{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.stat b{font:600 20px var(--font-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hlist{display:flex;flex-direction:column;gap:8px;max-width:760px}
.hrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.hrow .tm{font:500 13px var(--font-mono);color:var(--muted)}
.hrow .it{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .it small{display:block;color:var(--muted);font-size:12px}
.hrow .tt{font:600 15px var(--font-mono);font-variant-numeric:tabular-nums}
.date-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.date-row .field{width:auto}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.modal h2{font-size:18px;margin-bottom:14px}
.ed-pic{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ed-pic .pic{width:112px;flex:0 0 112px;border-radius:12px;font-size:36px}
.ed-pic .acts{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.form-row{margin-bottom:14px}
.price-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:10px;padding:0 12px}
.price-in span{font:500 15px var(--font-mono);color:var(--muted)}
.price-in input{flex:1;min-width:0;border:0;background:transparent;padding:10px 0;font:500 17px var(--font-mono);outline:none}
.price-in:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.modal-actions .grow{flex:1}
.rc{width:min(360px,100%)}
.rc .paper{max-height:none;margin-bottom:12px}
.rc-lines{padding:10px 18px;font:400 13px/1.5 var(--font-mono)}
.rc-item{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.rc-item span:first-child{min-width:0;overflow-wrap:anywhere}
.rc-item.sum{border-top:1px dashed var(--paper-line);margin-top:8px;padding-top:8px}
.rc-item.big{font-size:16px;font-weight:600}
.rc-foot{padding:6px 18px 18px;text-align:center;font:400 12px var(--font-mono);color:var(--muted)}
.rc-actions{display:flex;gap:8px;flex-wrap:wrap}
.rc-actions .btn{flex:1 1 120px}
.rc-actions .btn.primary{flex:1 1 100%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;box-shadow:var(--shadow)}

@media (min-width:900px){
  .layout{grid-template-columns:minmax(0,1fr) 380px;gap:24px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .cartbar,.backdrop{display:none!important}
  .main{padding-block:20px 48px}
}
@media (max-width:899px){
  .cart-panel{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:90%;display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  .cart-panel.open{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  .cart-panel .paper{max-height:none;margin:0;flex:1 1 auto;min-height:0;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .paper::after{display:none}
  .cart-panel .lines{max-height:none;overflow:visible;flex:none}
  .sheet-close{display:block}
  .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){
  .prow{grid-template-columns:48px minmax(0,1fr) auto;gap:10px}
  .prow .th{width:48px;height:48px}
  .tab{padding:8px 10px}
}
@media (prefers-reduced-motion:reduce){
  .cart-panel,.cart-panel.open{transition:none}
  .tile:active{transform:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1 id="shopName">Toko Saya</h1>
      <p id="today"></p>
    </div>
    <span id="modeTag" class="tag" hidden>Tersimpan di browser ini saja</span>
    <nav class="tabs" role="tablist" aria-label="Menu utama">
      <button class="tab" role="tab" id="tab-kasir" data-act="tab" data-tab="kasir" aria-selected="true">Kasir</button>
      <button class="tab" role="tab" id="tab-produk" data-act="tab" data-tab="produk" aria-selected="false">Produk</button>
      <button class="tab" role="tab" id="tab-riwayat" data-act="tab" data-tab="riwayat" aria-selected="false">Riwayat</button>
    </nav>
  </div>
</header>

<main class="wrap main">
  <!-- KASIR -->
  <section id="view-kasir" aria-labelledby="tab-kasir">
    <div class="layout">
      <div class="catalog">
        <div id="sampleNote" class="note" hidden>
          <p>Ini produk contoh. Ubah nama, gambar, dan harganya di tab Produk, atau hapus semuanya.</p>
          <button class="btn small" type="button" id="delSamples" data-act="delSamples">Hapus semua contoh</button>
        </div>
        <div class="toolbar">
          <input class="field" id="search" type="search" placeholder="Cari produk" autocomplete="off" aria-label="Cari produk">
          <div class="chips" id="chips" hidden></div>
        </div>
        <div class="grid" id="grid"><div class="empty">Memuat produk…</div></div>
      </div>

      <aside class="cart-panel" id="cartPanel" aria-label="Pesanan">
        <div class="paper">
          <div class="paper-head">
            <button class="sheet-close" type="button" data-act="closeCart">Tutup</button>
            <div class="shop" id="cartShop">Toko Saya</div>
            <div class="sub" id="cartSub">Pesanan baru</div>
            <button class="clear" type="button" id="clearBtn" data-act="clear" hidden>Kosongkan</button>
          </div>
          <div class="lines" id="lines"></div>
          <div class="pay">
            <div class="total-row"><span class="lbl">Total</span><span class="amt" id="totalAmt">Rp 0</span></div>
            <div class="seg" role="group" aria-label="Cara bayar">
              <button type="button" data-act="method" data-method="tunai" aria-pressed="true">Tunai</button>
              <button type="button" data-act="method" data-method="nontunai" aria-pressed="false">QRIS / Transfer</button>
            </div>
            <div id="cashBlock" style="display:flex;flex-direction:column;gap:12px">
              <label class="cash" for="cashIn"><span>Rp</span><input id="cashIn" inputmode="numeric" autocomplete="off" placeholder="Uang diterima"></label>
              <div class="quick" id="quick"></div>
              <div class="change-row" id="changeRow"></div>
            </div>
            <button class="btn primary block" type="button" id="payBtn" data-act="pay" disabled>Bayar</button>
          </div>
        </div>
      </aside>
    </div>
  </section>

  <!-- PRODUK -->
  <section id="view-produk" hidden aria-labelledby="tab-produk">
    <div class="panel">
      <label class="lbl" for="storeIn">Nama toko</label>
      <input class="field" id="storeIn" maxlength="40" placeholder="Contoh: Warung Bu Sari" autocomplete="off">
      <p class="hint">Muncul di atas layar dan di struk.</p>
    </div>
    <div class="section-head">
      <h2>Daftar produk</h2>
      <button class="btn primary" type="button" data-act="newProd">Tambah produk</button>
    </div>
    <div class="plist" id="plist"></div>
  </section>

  <!-- RIWAYAT -->
  <section id="view-riwayat" hidden aria-labelledby="tab-riwayat">
    <div class="section-head"><h2>Riwayat penjualan</h2></div>
    <div class="date-row">
      <label class="lbl" for="histDate" style="margin:0">Tanggal</label>
      <input class="field" type="date" id="histDate">
    </div>
    <div class="stats" id="stats"></div>
    <div class="hlist" id="hlist"></div>
  </section>
</main>

<div class="backdrop" id="cartBackdrop" data-act="closeCart" hidden></div>
<div class="cartbar" id="cartBar" hidden>
  <div class="info"><small id="barCount">0 item</small><b id="barTotal">Rp 0</b></div>
  <button class="btn primary" type="button" data-act="openCart">Lihat pesanan</button>
</div>

<div class="overlay" id="editor" hidden role="dialog" aria-modal="true" aria-labelledby="edTitle"></div>
<div class="overlay" id="receipt" hidden role="dialog" aria-modal="true" aria-label="Struk"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  'use strict';
  var $=function(s,r){return (r||document).querySelector(s);};
  var fmt=function(n){return new Intl.NumberFormat('id-ID').format(Math.round(n||0));};
  var rp=function(n){return 'Rp '+fmt(n);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var pad=function(n){return String(n).padStart(2,'0');};
  var dayKey=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  var todayKey=function(){return dayKey(new Date());};
  var tm=function(d){return pad(d.getHours())+':'+pad(d.getMinutes());};
  var longDate=function(d){return new Intl.DateTimeFormat('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);};
  var shortDate=function(d){return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'short',year:'numeric'}).format(d);};
  var hue=function(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))%360;}return h;};
  var initials=function(n){var w=String(n).trim().split(/\s+/);return (((w[0]||'')[0]||'?')+((w[1]||'')[0]||'')).toUpperCase();};

  var S={
    mode:'loading', products:[], store:{name:''}, days:{}, ready:{},
    cart:{}, cat:'Semua', q:'', tab:'kasir', histKey:todayKey(),
    method:'tunai', cash:0, pending:false, editing:null, sampleConfirm:false
  };
  var db=null, dl=null, unsubs={}, toastTimer=null;
  var STANDALONE=!(window.claude&&window.claude.use);
  var LS='kasirku:v1';

  /* ---------- Penyimpanan ---------- */
  function loadLocal(){
    try{
      var j=JSON.parse(localStorage.getItem(LS)||'null');
      if(j){S.products=j.products||[];S.store=j.store||{name:''};S.days=j.days||{};}
    }catch(e){}
  }
  function saveLocal(){
    try{localStorage.setItem(LS,JSON.stringify({products:S.products,store:S.store,days:S.days}));}
    catch(e){toast('Penyimpanan browser penuh atau diblokir.');}
  }
  function fail(e){
    var c=e&&e.code;
    if(c==='quota_exceeded')toast('Penyimpanan penuh. Hapus beberapa produk atau gambar.');
    else if(c==='invalid_argument')toast('Kamu tidak punya izin mengubah data ini.');
    else toast('Gagal menyimpan. Coba lagi sebentar lagi.');
  }
  async function ensureDay(key){
    if(db&&!S.ready[key]){
      var snap=await db.doc('days/'+key).get();
      var d=snap.exists?snap.data():null;
      S.days[key]=(d&&Array.isArray(d.sales))?d.sales.slice():[];
    }else if(!S.days[key]){S.days[key]=[];}
    return S.days[key];
  }
  var data={
    saveProduct:async function(id,p){
      if(db){await db.doc('products/'+id).set(p);}
      else{
        var rec=Object.assign({id:id},p),i=S.products.findIndex(function(x){return x.id===id;});
        if(i<0)S.products.push(rec);else S.products[i]=rec;
        saveLocal();
      }
    },
    deleteProducts:async function(ids){
      if(db){for(var i=0;i<ids.length;i++){await db.doc('products/'+ids[i]).delete();}}
      else{S.products=S.products.filter(function(p){return ids.indexOf(p.id)<0;});saveLocal();}
    },
    saveStore:async function(name){
      if(db){await db.doc('settings/store').set({name:name});}
      else{S.store={name:name};saveLocal();}
    },
    addSale:async function(sale){
      var key=dayKey(new Date(sale.t));
      var cur=await ensureDay(key);
      var sales=cur.concat([sale]);
      if(db){
        await db.doc('days/'+key).set({sales:sales,count:sales.length,total:sales.reduce(function(a,s){return a+s.total;},0)});
      }
      S.days[key]=sales;
      if(!db)saveLocal();
    }
  };
  function watchDay(key){
    if(!db||unsubs[key])return;
    unsubs[key]=db.doc('days/'+key).onSnapshot(function(snap){
      var d=snap.exists?snap.data():null;
      S.days[key]=(d&&Array.isArray(d.sales))?d.sales:[];
      if(!snap.metadata.fromCache)S.ready[key]=true;
      renderHistory();
    },fail);
  }

  /* ---------- Turunan ---------- */
  var shopName=function(){return (S.store&&S.store.name&&S.store.name.trim())||'Toko Saya';};
  function sortedProducts(){
    return S.products.slice().sort(function(a,b){return ((a.ord||0)-(b.ord||0))||String(a.name).localeCompare(String(b.name),'id');});
  }
  function cartLines(){
    var out=[];
    Object.keys(S.cart).forEach(function(id){
      var p=S.products.find(function(x){return x.id===id;}),q=S.cart[id];
      if(p&&q>0)out.push({p:p,q:q});
    });
    return out;
  }
  var cartTotal=function(){return cartLines().reduce(function(a,l){return a+l.p.price*l.q;},0);};
  var cartCount=function(){return cartLines().reduce(function(a,l){return a+l.q;},0);};
  function pic(p){
    return p.image?'<img src="'+esc(p.image)+'" alt="" loading="lazy">':'<span aria-hidden="true">'+esc(initials(p.name))+'</span>';
  }

  /* ---------- Render ---------- */
  function toast(msg){
    var t=$('#toast');t.textContent=msg;t.hidden=false;
    clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},2800);
  }
  function renderChrome(){
    $('#shopName').textContent=shopName();
    $('#cartShop').textContent=shopName();
    $('#today').textContent=longDate(new Date());
    $('#modeTag').hidden=S.mode!=='local';
    ['kasir','produk','riwayat'].forEach(function(t){
      $('#tab-'+t).setAttribute('aria-selected',String(S.tab===t));
      $('#view-'+t).hidden=S.tab!==t;
    });
    var si=$('#storeIn');if(document.activeElement!==si)si.value=(S.store&&S.store.name)||'';
    updateBar();
  }
  function renderGrid(){
    var g=$('#grid'),chips=$('#chips');
    $('#sampleNote').hidden=!S.products.some(function(p){return p.sample;});
    if(S.mode==='loading'){g.innerHTML='<div class="empty">Memuat produk…</div>';chips.hidden=true;return;}
    var list=sortedProducts();
    var cats=[];list.forEach(function(p){if(p.cat&&cats.indexOf(p.cat)<0)cats.push(p.cat);});
    if(S.cat!=='Semua'&&cats.indexOf(S.cat)<0)S.cat='Semua';
    chips.hidden=cats.length===0;
    chips.innerHTML=['Semua'].concat(cats).map(function(c){
      return '<button class="chip" type="button" data-act="cat" data-cat="'+esc(c)+'" aria-pressed="'+(c===S.cat)+'">'+esc(c)+'</button>';
    }).join('');
    if(!list.length){
      g.innerHTML='<div class="empty"><strong>Belum ada produk</strong>Tambahkan produk pertama dengan nama, gambar, dan harga.<br><button class="btn primary" type="button" data-act="newProd">Tambah produk</button></div>';
      return;
    }
    var q=S.q.trim().toLowerCase();
    var shown=list.filter(function(p){return (S.cat==='Semua'||p.cat===S.cat)&&(!q||String(p.name).toLowerCase().indexOf(q)>=0);});
    if(!shown.length){g.innerHTML='<div class="empty">Tidak ada produk yang cocok.</div>';return;}
    g.innerHTML=shown.map(function(p){
      var qty=S.cart[p.id]||0;
      return '<button class="tile" type="button" data-act="add" data-id="'+esc(p.id)+'" style="--h:'+hue(String(p.name))+'" aria-label="'+esc(p.name)+', '+rp(p.price)+'">'
        +'<div class="pic">'+pic(p)+'</div>'
        +'<span class="badge" '+(qty?'':'hidden')+'>'+qty+'</span>'
        +'<div class="meta"><span class="nm">'+esc(p.name)+'</span><span class="pr">'+rp(p.price)+'</span></div></button>';
    }).join('');
  }
  function updateBadges(){
    document.querySelectorAll('.tile').forEach(function(t){
      var q=S.cart[t.dataset.id]||0,b=t.querySelector('.badge');
      b.textContent=q;b.hidden=!q;
    });
  }
  function renderCart(){
    var lines=cartLines(),total=cartTotal();
    $('#lines').innerHTML=lines.length?lines.map(function(l){
      return '<div class="line"><div class="t">'+esc(l.p.name)+'</div><div class="amt">'+rp(l.p.price*l.q)+'</div>'
        +'<div class="stepper"><button type="button" data-act="dec" data-id="'+esc(l.p.id)+'" aria-label="Kurangi '+esc(l.p.name)+'">−</button><b>'+l.q+'</b><button type="button" data-act="inc" data-id="'+esc(l.p.id)+'" aria-label="Tambah '+esc(l.p.name)+'">+</button><span class="unit">× '+fmt(l.p.price)+'</span></div>'
        +'<button class="rm" type="button" data-act="rm" data-id="'+esc(l.p.id)+'" aria-label="Hapus '+esc(l.p.name)+' dari pesanan">Hapus</button></div>';
    }).join(''):'<div class="cart-empty">Ketuk produk untuk menambah ke pesanan.</div>';
    $('#totalAmt').textContent=rp(total);
    $('#clearBtn').hidden=!lines.length;
    $('#cartSub').textContent=lines.length?cartCount()+' item':'Pesanan baru';
    updateBar();
    renderPay();
  }
  function updateBar(){
    var n=cartCount();
    $('#cartBar').hidden=!(n>0&&S.tab==='kasir');
    $('#barCount').textContent=n+' item';
    $('#barTotal').textContent=rp(cartTotal());
  }
  function quickCash(total){
    var set=[total];
    [5000,10000,20000,50000,100000].forEach(function(d){var v=Math.ceil(total/d)*d;if(v>=total&&set.indexOf(v)<0)set.push(v);});
    return set.sort(function(a,b){return a-b;}).slice(0,4);
  }
  function renderPay(){
    var total=cartTotal(),has=cartLines().length>0,tunai=S.method==='tunai';
    document.querySelectorAll('[data-act="method"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.method===S.method));});
    $('#cashBlock').style.display=tunai?'flex':'none';
    $('#quick').innerHTML=(tunai&&total>0)?quickCash(total).map(function(v,i){
      return '<button type="button" data-act="quick" data-v="'+v+'">'+(i===0?'Uang pas':fmt(v))+'</button>';
    }).join(''):'';
    var row=$('#changeRow');
    if(tunai&&has){
      if(S.cash>=total)row.innerHTML='<span class="lbl">Kembalian</span><span class="val">'+rp(S.cash-total)+'</span>';
      else if(S.cash>0)row.innerHTML='<span class="lbl">Kurang</span><span class="val short">'+rp(total-S.cash)+'</span>';
      else row.innerHTML='<span class="lbl">Kembalian</span><span class="val">Rp&nbsp;0</span>';
    }else row.innerHTML='';
    var btn=$('#payBtn');
    btn.disabled=!has||S.pending||(tunai&&S.cash<total);
    btn.textContent=S.pending?'Menyimpan…':(has?'Bayar '+rp(total):'Bayar');
  }
  function renderProducts(){
    var list=sortedProducts();
    $('#plist').innerHTML=list.length?list.map(function(p){
      return '<div class="prow" style="--h:'+hue(String(p.name))+'"><div class="th"><div class="pic">'+pic(p)+'</div></div>'
        +'<div class="info"><div class="nm">'+esc(p.name)+'</div><div class="sub">'+rp(p.price)+(p.cat?' · '+esc(p.cat):'')+'</div></div>'
        +'<button class="btn small" type="button" data-act="editProd" data-id="'+esc(p.id)+'">Ubah</button></div>';
    }).join(''):'<div class="empty">'+(S.mode==='loading'?'Memuat produk…':'Belum ada produk. Ketuk Tambah produk.')+'</div>';
  }
  function renderHistory(){
    var key=S.histKey,sales=S.days[key];
    var hd=$('#histDate');if(hd.value!==key&&document.activeElement!==hd)hd.value=key;
    if(!sales){$('#stats').innerHTML='';$('#hlist').innerHTML='<div class="empty">Memuat transaksi…</div>';return;}
    var omzet=sales.reduce(function(a,s){return a+s.total;},0);
    var items=sales.reduce(function(a,s){return a+s.items.reduce(function(b,i){return b+i.q;},0);},0);
    $('#stats').innerHTML='<div class="stat"><small>Omzet</small><b>'+rp(omzet)+'</b></div><div class="stat"><small>Transaksi</small><b>'+sales.length+'</b></div><div class="stat"><small>Item terjual</small><b>'+items+'</b></div>';
    $('#hlist').innerHTML=sales.length?sales.slice().reverse().map(function(s){
      var d=new Date(s.t),n=s.items.reduce(function(a,i){return a+i.q;},0);
      return '<button class="hrow" type="button" data-act="openSale" data-id="'+esc(s.id)+'" data-key="'+esc(key)+'"><span class="tm">'+tm(d)+'</span>'
        +'<span class="it">'+esc(s.items.map(function(i){return i.q+' '+i.n;}).join(', '))+'<small>'+n+' item · '+(s.method==='tunai'?'Tunai':'QRIS / Transfer')+'</small></span>'
        +'<span class="tt">'+rp(s.total)+'</span></button>';
    }).join(''):'<div class="empty">Belum ada transaksi pada tanggal ini.</div>';
  }
  function renderAll(){renderChrome();renderGrid();renderCart();renderProducts();renderHistory();}

  /* ---------- Keranjang ---------- */
  function setQty(id,q){
    if(q<=0)delete S.cart[id];else S.cart[id]=q;
    updateBadges();renderCart();
  }
  function openCart(){
    $('#cartPanel').classList.add('open');$('#cartBackdrop').hidden=false;
  }
  function closeCart(){
    $('#cartPanel').classList.remove('open');$('#cartBackdrop').hidden=true;
  }
  async function pay(){
    if(S.pending)return;
    var lines=cartLines(),total=cartTotal();
    if(!lines.length)return;
    if(S.method==='tunai'&&S.cash<total)return;
    S.pending=true;renderPay();
    var t=new Date();
    var sale={id:'s'+t.getTime().toString(36)+Math.random().toString(36).slice(2,4),t:t.toISOString(),
      items:lines.map(function(l){return {n:l.p.name,p:l.p.price,q:l.q};}),total:total,method:S.method};
    if(S.method==='tunai'){sale.cash=S.cash;sale.change=S.cash-total;}
    try{
      await data.addSale(sale);
      S.cart={};S.cash=0;$('#cashIn').value='';
      closeCart();updateBadges();renderCart();renderHistory();
      showReceipt(sale,true);
    }catch(e){fail(e);}
    finally{S.pending=false;renderPay();}
  }

  /* ---------- Struk ---------- */
  function saleNo(sale){
    var key=dayKey(new Date(sale.t)),arr=S.days[key]||[];
    var i=arr.findIndex(function(s){return s.id===sale.id;});
    return pad3(i>=0?i+1:arr.length);
  }
  function pad3(n){return String(n).padStart(3,'0');}
  function receiptText(sale){
    var W=32,d=new Date(sale.t),out=[];
    var line=function(l,r){return l+' '.repeat(Math.max(1,W-l.length-r.length))+r;};
    out.push(shopName().toUpperCase());
    out.push(shortDate(d)+' '+tm(d)+'  #'+saleNo(sale));
    out.push('-'.repeat(W));
    sale.items.forEach(function(i){out.push(i.q+' x '+i.n);out.push(line('   @'+fmt(i.p),fmt(i.p*i.q)));});
    out.push('-'.repeat(W));
    out.push(line('TOTAL','Rp '+fmt(sale.total)));
    if(sale.method==='tunai'){out.push(line('Tunai','Rp '+fmt(sale.cash)));out.push(line('Kembali','Rp '+fmt(sale.change)));}
    else out.push(line('Bayar','QRIS / Transfer'));
    out.push('');out.push('Terima kasih');
    return out.join('\n');
  }
  var lastReceipt=null;
  function showReceipt(sale,isNew){
    lastReceipt=sale;
    var d=new Date(sale.t);
    var rows=sale.items.map(function(i){return '<div class="rc-item"><span>'+i.q+' × '+esc(i.n)+'</span><span>'+fmt(i.p*i.q)+'</span></div>';}).join('');
    var pay=sale.method==='tunai'
      ?'<div class="rc-item"><span>Tunai</span><span>'+fmt(sale.cash)+'</span></div><div class="rc-item"><span>Kembali</span><span>'+fmt(sale.change)+'</span></div>'
      :'<div class="rc-item"><span>Bayar</span><span>QRIS / Transfer</span></div>';
    $('#receipt').innerHTML='<div class="rc"><div class="paper">'
      +'<div class="paper-head"><div class="shop">'+esc(shopName())+'</div><div class="sub">'+esc(shortDate(d))+' · '+tm(d)+' · #'+saleNo(sale)+'</div></div>'
      +'<div class="rc-lines">'+rows+'<div class="rc-item sum big"><span>TOTAL</span><span>Rp '+fmt(sale.total)+'</span></div>'+pay+'</div>'
      +'<div class="rc-foot">Terima kasih</div></div>'
      +'<div class="rc-actions">'
      +((dl||STANDALONE)?'<button class="btn primary" type="button" data-act="rcImage">Simpan gambar</button>':'')
      +'<button class="btn" type="button" data-act="rcCopy">Salin teks</button>'
      +'<button class="btn'+((dl||STANDALONE)?'':' primary')+'" type="button" data-act="rcClose">'+(isNew?'Transaksi baru':'Tutup')+'</button></div></div>';
    $('#receipt').hidden=false;
  }
  async function copyText(t){
    try{await navigator.clipboard.writeText(t);toast('Struk disalin.');}
    catch(e){
      var ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');toast('Struk disalin.');}catch(_){toast('Tidak bisa menyalin struk.');}
      ta.remove();
    }
  }

  /* ---------- Gambar struk ---------- */
  async function receiptImage(sale){
    try{await Promise.all([document.fonts.load('600 16px "IBM Plex Mono"'),document.fonts.load('400 13px "IBM Plex Mono"')]);}catch(e){}
    var MONO='"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace';
    var SC=2,W=380,M=16,P=22,INK='#1B2A31',MUTED='#5E717C',LINE='#B9C6CD';
    var L=M+P,R=W-M-P,inner=R-L;
    function paint(ctx,draw){
      var y=M+P,d=new Date(sale.t);
      ctx.textBaseline='top';
      function font(w,s){ctx.font=w+' '+s+'px '+MONO;}
      function center(t,w,s,col,gap){
        font(w,s);
        if(draw){ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(t,W/2,y);}
        y+=s+gap;
      }
      function dash(){
        if(draw){ctx.strokeStyle=LINE;ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(L,y+.5);ctx.lineTo(R,y+.5);ctx.stroke();ctx.setLineDash([]);}
        y+=16;
      }
      function pair(l,r,w,s,col){
        font(w,s);
        if(draw){ctx.fillStyle=col;ctx.textAlign='left';ctx.fillText(l,L,y);ctx.textAlign='right';ctx.fillText(r,R,y);}
        y+=s+9;
      }
      function wrap(t,maxW){
        var words=String(t).split(/\s+/),lines=[],cur='';
        words.forEach(function(w){
          while(ctx.measureText(w).width>maxW&&w.length>1){
            var k=w.length-1;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;
            if(cur){lines.push(cur);cur='';}
            lines.push(w.slice(0,k));w=w.slice(k);
          }
          var test=cur?cur+' '+w:w;
          if(ctx.measureText(test).width>maxW&&cur){lines.push(cur);cur=w;}else cur=test;
        });
        if(cur)lines.push(cur);
        return lines;
      }
      var shopLines=(font('600',16),wrap(shopName().toUpperCase(),inner));
      shopLines.forEach(function(ln){center(ln,'600',16,INK,4);});
      center(shortDate(d)+' · '+tm(d)+' · #'+saleNo(sale),'400',12,MUTED,14);
      dash();
      sale.items.forEach(function(i){
        font('400',13);
        var amt=fmt(i.p*i.q),amtW=ctx.measureText(amt).width;
        var lines=wrap(i.q+' × '+i.n,inner-amtW-14);
        lines.forEach(function(ln,k){
          font('400',13);
          if(draw){ctx.fillStyle=INK;ctx.textAlign='left';ctx.fillText(ln,L,y);if(k===0){ctx.textAlign='right';ctx.fillText(amt,R,y);}}
          y+=19;
        });
        font('400',11);
        if(draw){ctx.fillStyle=MUTED;ctx.textAlign='left';ctx.fillText('@ '+fmt(i.p),L,y);}
        y+=20;
      });
      dash();
      pair('TOTAL','Rp '+fmt(sale.total),'600',18,INK);
      if(sale.method==='tunai'){
        pair('Tunai','Rp '+fmt(sale.cash),'400',13,INK);
        pair('Kembali','Rp '+fmt(sale.change),'400',13,INK);
      }else pair('Bayar','QRIS / Transfer','400',13,INK);
      y+=8;
      center('Terima kasih','400',12,MUTED,0);
      return y+P;
    }
    var H=paint(document.createElement('canvas').getContext('2d'),false)+M+8;
    var c=document.createElement('canvas');c.width=W*SC;c.height=H*SC;
    var x=c.getContext('2d');x.scale(SC,SC);
    x.fillStyle='#E9EEF1';x.fillRect(0,0,W,H);
    x.fillStyle='#FFFFFF';x.beginPath();x.moveTo(M,M);x.lineTo(W-M,M);x.lineTo(W-M,H-M-8);
    var step=12,n=Math.floor((W-2*M)/step);
    for(var k=0;k<n;k++){var xr=W-M-k*step;x.lineTo(xr-step/2,H-M);x.lineTo(xr-step,H-M-8);}
    x.lineTo(M,H-M-8);x.closePath();x.fill();
    paint(x,true);
    return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('toBlob'));},'image/png');});
  }
  async function saveReceiptImage(btn){
    if(!(dl||STANDALONE)||!lastReceipt)return;
    btn.disabled=true;
    try{
      var blob=await receiptImage(lastReceipt);
      var fname='struk-'+saleNo(lastReceipt)+'-'+dayKey(new Date(lastReceipt.t))+'.png';
      if(dl){await dl.save({filename:fname,data:blob});}
      else{
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;
        document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      }
      toast('Gambar struk disimpan.');
    }catch(e){
      if(!(e&&e.code==='declined'))toast('Gambar struk tidak bisa disimpan di sini.');
    }finally{btn.disabled=false;}
  }

  /* ---------- Editor produk ---------- */
  function openEditor(id){
    var p=id?S.products.find(function(x){return x.id===id;}):null;
    S.editing={id:id||null,image:p?(p.image||''):'',ord:p?p.ord:null,del:false,saving:false,name:p?p.name:''};
    var cats=[];S.products.forEach(function(x){if(x.cat&&cats.indexOf(x.cat)<0)cats.push(x.cat);});
    $('#editor').innerHTML='<div class="modal">'
      +'<h2 id="edTitle">'+(p?'Ubah produk':'Produk baru')+'</h2>'
      +'<div class="ed-pic"><div class="pic" id="edPic"></div><div class="acts">'
      +'<button class="btn small" type="button" data-act="edPick">Pilih gambar</button>'
      +'<button class="btn small" type="button" id="edClear" data-act="edClearImg">Hapus gambar</button>'
      +'<input type="file" id="edFile" accept="image/*" hidden></div></div>'
      +'<div class="form-row"><label class="lbl" for="edName">Nama produk</label><input class="field" id="edName" maxlength="60" autocomplete="off" placeholder="Contoh: Es Teh Manis" value="'+esc(p?p.name:'')+'"></div>'
      +'<div class="form-row"><label class="lbl" for="edPrice">Harga</label><div class="price-in"><span>Rp</span><input id="edPrice" inputmode="numeric" autocomplete="off" placeholder="5.000" value="'+(p?fmt(p.price):'')+'"></div></div>'
      +'<div class="form-row"><label class="lbl" for="edCat">Kategori (boleh kosong)</label><input class="field" id="edCat" maxlength="24" autocomplete="off" list="catList" placeholder="Contoh: Minuman" value="'+esc(p?(p.cat||''):'')+'"><datalist id="catList">'+cats.map(function(c){return '<option value="'+esc(c)+'">';}).join('')+'</datalist></div>'
      +'<div class="modal-actions">'
      +'<button class="btn primary grow" type="button" id="edSave" data-act="edSave">Simpan</button>'
      +'<button class="btn" type="button" data-act="edCancel">Batal</button>'
      +(p?'<button class="btn danger" type="button" id="edDel" data-act="edDel">Hapus produk</button>':'')
      +'</div></div>';
    refreshEdPic();
    $('#editor').hidden=false;
    setTimeout(function(){var n=$('#edName');if(n)n.focus();},30);
  }
  function refreshEdPic(){
    var e=S.editing,nm=($('#edName')&&$('#edName').value)||e.name||'?';
    var box=$('#edPic');
    box.style.setProperty('--h',hue(nm));
    box.innerHTML=e.image?'<img src="'+esc(e.image)+'" alt="Gambar produk">':'<span aria-hidden="true">'+esc(initials(nm))+'</span>';
    $('#edClear').hidden=!e.image;
  }
  function closeEditor(){$('#editor').hidden=true;S.editing=null;}
  function fileToThumb(file,size){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file),img=new Image();
      img.onload=function(){
        var s=Math.min(img.width,img.height),sx=(img.width-s)/2,sy=(img.height-s)/2;
        var c=document.createElement('canvas');c.width=c.height=size;
        var ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,size,size);
        ctx.drawImage(img,sx,sy,s,s,0,0,size,size);
        URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82));
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'));};
      img.src=url;
    });
  }
  async function saveEditor(){
    var e=S.editing;if(!e||e.saving)return;
    var name=$('#edName').value.trim();
    var price=parseInt(($('#edPrice').value||'').replace(/\D/g,''),10)||0;
    if(!name){toast('Isi nama produk dulu.');$('#edName').focus();return;}
    var id=e.id||('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5));
    var prod={name:name,price:price,cat:$('#edCat').value.trim(),image:e.image||'',ord:e.ord||Date.now()};
    e.saving=true;$('#edSave').disabled=true;
    try{await data.saveProduct(id,prod);closeEditor();if(!db){renderAll();}toast('Produk disimpan.');}
    catch(err){fail(err);e.saving=false;var b=$('#edSave');if(b)b.disabled=false;}
  }
  async function deleteEditing(){
    var e=S.editing;if(!e||!e.id)return;
    var b=$('#edDel');
    if(!e.del){
      e.del=true;b.textContent='Yakin hapus?';
      setTimeout(function(){if(S.editing===e&&e.del){e.del=false;var x=$('#edDel');if(x)x.textContent='Hapus produk';}},4000);
      return;
    }
    try{
      var id=e.id;await data.deleteProducts([id]);delete S.cart[id];
      closeEditor();if(!db)renderAll();else{updateBadges();renderCart();}
      toast('Produk dihapus.');
    }catch(err){fail(err);}
  }

  /* ---------- Tab ---------- */
  function setTab(t){
    S.tab=t;
    if(t!=='kasir')closeCart();
    if(t==='riwayat'){watchDay(S.histKey);renderHistory();}
    renderChrome();
    window.scrollTo(0,0);
  }

  /* ---------- Event ---------- */
  document.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');if(!b)return;
    var a=b.dataset.act,id=b.dataset.id;
    switch(a){
      case 'tab':setTab(b.dataset.tab);break;
      case 'cat':S.cat=b.dataset.cat;renderGrid();break;
      case 'add':setQty(id,(S.cart[id]||0)+1);break;
      case 'inc':setQty(id,(S.cart[id]||0)+1);break;
      case 'dec':setQty(id,(S.cart[id]||0)-1);break;
      case 'rm':setQty(id,0);break;
      case 'clear':S.cart={};S.cash=0;$('#cashIn').value='';updateBadges();renderCart();break;
      case 'method':S.method=b.dataset.method;renderPay();break;
      case 'quick':S.cash=+b.dataset.v;$('#cashIn').value=fmt(S.cash);renderPay();break;
      case 'pay':pay();break;
      case 'openCart':openCart();break;
      case 'closeCart':closeCart();break;
      case 'newProd':openEditor(null);break;
      case 'editProd':openEditor(id);break;
      case 'edSave':saveEditor();break;
      case 'edCancel':closeEditor();break;
      case 'edDel':deleteEditing();break;
      case 'edPick':$('#edFile').click();break;
      case 'edClearImg':S.editing.image='';refreshEdPic();break;
      case 'rcCopy':if(lastReceipt)copyText(receiptText(lastReceipt));break;
      case 'rcImage':saveReceiptImage(b);break;
      case 'rcClose':$('#receipt').hidden=true;break;
      case 'openSale':
        var arr=S.days[b.dataset.key]||[],s=arr.find(function(x){return x.id===id;});
        if(s)showReceipt(s,false);
        break;
      case 'delSamples':
        if(!S.sampleConfirm){
          S.sampleConfirm=true;b.textContent='Yakin? Ketuk lagi untuk hapus';
          setTimeout(function(){S.sampleConfirm=false;b.textContent='Hapus semua contoh';},4000);
        }else{
          S.sampleConfirm=false;b.textContent='Hapus semua contoh';
          var ids=S.products.filter(function(p){return p.sample;}).map(function(p){return p.id;});
          data.deleteProducts(ids).then(function(){
            ids.forEach(function(i){delete S.cart[i];});
            if(!db)renderAll();else{updateBadges();renderCart();}
            toast('Produk contoh dihapus.');
          }).catch(fail);
        }
        break;
    }
  });
  $('#editor').addEventListener('click',function(e){if(e.target===this)closeEditor();});
  $('#receipt').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(!$('#editor').hidden)closeEditor();
    else if(!$('#receipt').hidden)$('#receipt').hidden=true;
    else closeCart();
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='search'){S.q=t.value;renderGrid();}
    else if(t.id==='cashIn'){
      var n=parseInt(t.value.replace(/\D/g,''),10)||0;
      S.cash=n;t.value=n?fmt(n):'';renderPay();
    }else if(t.id==='edPrice'){
      var p=parseInt(t.value.replace(/\D/g,''),10)||0;
      t.value=p?fmt(p):'';
    }else if(t.id==='edName'){
      if(!S.editing.image)refreshEdPic();
    }
  });
  document.addEventListener('change',async function(e){
    var t=e.target;
    if(t.id==='edFile'&&t.files&&t.files[0]){
      try{S.editing.image=await fileToThumb(t.files[0],320);refreshEdPic();}
      catch(err){toast('Gambar tidak bisa dibaca. Coba file lain.');}
      t.value='';
    }else if(t.id==='storeIn'){
      var name=t.value.trim();
      try{await data.saveStore(name);if(!db){renderChrome();}toast('Nama toko disimpan.');}catch(err){fail(err);}
    }else if(t.id==='histDate'){
      if(t.value){S.histKey=t.value;watchDay(t.value);renderHistory();}
    }
  });
  $('#storeIn').addEventListener('keydown',function(e){if(e.key==='Enter')this.blur();});

  /* ---------- Mulai ---------- */
  renderAll();
  async function start(){
    try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null;}catch(e){dl=null;}
    try{db=(window.claude&&window.claude.use)?await window.claude.use('db'):null;}catch(e){db=null;}
    if(db){
      db.collection('products').onSnapshot(function(snap){
        S.products=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
        S.mode='db';renderGrid();renderCart();renderProducts();
      },fail);
      db.doc('settings/store').onSnapshot(function(snap){
        S.store=snap.exists?Object.assign({},snap.data()):{name:''};
        renderChrome();renderCart();
      },fail);
      watchDay(todayKey());
    }else{
      loadLocal();S.mode='local';
    }
    renderAll();
  }
  start();
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
</body>
